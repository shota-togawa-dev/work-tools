<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FRS工法による浴室カビ対策のイメージ</title>
  <desc id="desc">浴室のタイル壁に発生したカビを、青い噴霧で清潔な状態へ整えるイメージ。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef8ff"/>
      <stop offset="0.52" stop-color="#d8edf8"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="clean" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15364a" stop-opacity="0"/>
      <stop offset="0.38" stop-color="#1e9ee8" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="nozzle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102332"/>
      <stop offset="1" stop-color="#376073"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.52">
    <path d="M0 185h1600M0 365h1600M0 545h1600M0 725h1600" fill="none" stroke="#a9c5d6" stroke-width="2"/>
    <path d="M210 0v900M430 0v900M650 0v900M870 0v900M1090 0v900M1310 0v900" fill="none" stroke="#a9c5d6" stroke-width="2"/>
  </g>

  <g opacity="0.9">
    <circle cx="252" cy="275" r="24" fill="#1f3b37" opacity="0.68"/>
    <circle cx="310" cy="330" r="13" fill="#2d5a47" opacity="0.58"/>
    <circle cx="355" cy="245" r="18" fill="#264d41" opacity="0.56"/>
    <circle cx="238" cy="405" r="16" fill="#1d4039" opacity="0.5"/>
    <circle cx="424" cy="390" r="12" fill="#315d4d" opacity="0.5"/>
    <circle cx="315" cy="510" r="22" fill="#1f3b37" opacity="0.48"/>
    <circle cx="470" cy="292" r="9" fill="#264d41" opacity="0.46"/>
  </g>

  <path d="M430 120c215 20 402 82 570 184 126 76 239 172 336 286H650c-104-52-197-116-278-192-58-54-101-113-128-176 55-62 116-97 186-102Z" fill="url(#clean)" opacity="0.84"/>
  <path d="M520 220c178 14 331 61 461 141 99 61 187 139 265 235H762c-93-38-178-87-253-146-55-43-101-93-139-150 43-48 93-75 150-80Z" fill="#ffffff" opacity="0.28" filter="url(#softBlur)"/>

  <g transform="translate(1160 365) rotate(-9)">
    <rect x="0" y="0" width="250" height="58" rx="20" fill="url(#nozzle)"/>
    <rect x="208" y="10" width="150" height="38" rx="14" fill="#132e40"/>
    <rect x="36" y="50" width="70" height="180" rx="24" fill="#1b4054"/>
    <rect x="50" y="78" width="42" height="146" rx="18" fill="#2e6f8d"/>
    <circle cx="18" cy="28" r="20" fill="#1e9ee8"/>
  </g>

  <g opacity="0.7">
    <circle cx="728" cy="270" r="5" fill="#1e9ee8"/>
    <circle cx="790" cy="320" r="4" fill="#1e9ee8"/>
    <circle cx="860" cy="355" r="6" fill="#44aee8"/>
    <circle cx="915" cy="420" r="4" fill="#1e9ee8"/>
    <circle cx="980" cy="485" r="5" fill="#44aee8"/>
  </g>

  <rect x="0" y="0" width="1600" height="900" fill="#123449" opacity="0.05"/>
</svg>
